name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check api/contact.js
          node --check script.js

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: validate

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy production build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          MONGODB_COLLECTION: ${{ secrets.MONGODB_COLLECTION }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_EMAIL_TO: ${{ secrets.CONTACT_EMAIL_TO }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets are not set. Skipping Vercel deployment."
            exit 0
          fi

          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

          sync_vercel_env() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "::warning::$name is empty. Skipping Vercel env sync for $name."
              return
            fi

            npx vercel@latest env rm "$name" production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf "%s" "$value" | npx vercel@latest env add "$name" production --token="$VERCEL_TOKEN"
          }

          sync_vercel_env "MONGODB_URI" "$MONGODB_URI"
          sync_vercel_env "MONGODB_DB" "$MONGODB_DB"
          sync_vercel_env "MONGODB_COLLECTION" "$MONGODB_COLLECTION"
          sync_vercel_env "RESEND_API_KEY" "$RESEND_API_KEY"
          sync_vercel_env "CONTACT_EMAIL_TO" "$CONTACT_EMAIL_TO"

          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
